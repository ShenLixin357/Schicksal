<!doctype html>
<html lang="zh-CN" data-demo-mode="card"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solstice Dendrite · Card Motion Only</title>
<style>
:root{color-scheme:dark;--warm:#f3e7d5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0e1623;color:var(--warm);font-family:Georgia,serif}
.wrap{width:min(96vw,840px);margin:auto;padding:18px 0 32px}
header{text-align:center;padding:0 0 12px}
.kicker{font:10px/1.8 system-ui,sans-serif;letter-spacing:.28em;color:#d7c5a2}
h1{font:italic 400 clamp(24px,4vw,32px)/1.4 Georgia,serif;margin:3px 0}
.stage{position:relative;isolation:isolate;height:min(72vh,650px);min-height:450px;border:1px solid #d9c6a73d;border-radius:16px;overflow:hidden;perspective:1300px;cursor:pointer;box-shadow:0 18px 66px #0208138a;background:radial-gradient(ellipse at 50% 3%,#71839c69,transparent 46%),linear-gradient(#26384e,#111c2d 80%)}
.stage:focus-visible{outline:2px solid #ffe9c2;outline-offset:3px}
.ambient{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 53%,#fff0cc2d 0%,#fff1d20e 43%,transparent 69%)}
.beam{position:absolute;z-index:2;left:50%;top:-3%;height:110%;width:min(115vw,900px);transform:translateX(-50%);clip-path:polygon(32% 0%,68% 0%,96% 100%,4% 100%);background:linear-gradient(#fffdf3a1,#fff0ca72 25%,#f5e4c331 75%,transparent);filter:blur(17px);mix-blend-mode:screen;pointer-events:none}
.pool{position:absolute;z-index:2;left:50%;top:56%;width:min(88vw,550px);height:94%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,#fffae263,transparent 67%);filter:blur(25px);pointer-events:none}
.card{position:absolute;z-index:5;left:50%;top:54%;width:clamp(165px,25vw,226px);aspect-ratio:2/3;transform:translate(-50%,-50%);transform-style:preserve-3d;pointer-events:none}
.spin{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateZ(-4.8deg)}
.face{position:absolute;inset:0;border-radius:7px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(140deg,#dfeaf8,#fff9ea,#d4e3f1);box-shadow:0 0 14px #fff7dc83,0 0 30px #ffefc64f,0 16px 35px #0a14267e}
.front{transform:rotate3d(.5547,-.83205,0,180deg)}
.face>img.background{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.flower{position:absolute;left:50%;top:22%;width:81%;height:61%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 0 3px #fff8ec96)}
.title-art{position:absolute;left:12%;bottom:6.6%;width:76%;height:11.2%;pointer-events:none}
.title-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.85}
.core-anchor{position:absolute;width:2px;height:2px;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
#snowCanvas,#fxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#snowCanvas{z-index:6}
#fxCanvas{z-index:8;mix-blend-mode:screen}
#coreGuide{display:none;position:absolute;z-index:9;pointer-events:none;width:16px;height:16px;transform:translate(-50%,-50%);border:1px solid #fbe1aa;border-radius:50%;box-shadow:0 0 10px #fff}
#coreGuide:before,#coreGuide:after{content:"";position:absolute;background:#fff}
#coreGuide:before{height:24px;width:1px;left:7px;top:-5px}
#coreGuide:after{width:24px;height:1px;top:7px;left:-5px}
.missing{position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);background:#101b2be8;border:1px solid #f7d9a74f;border-radius:12px;padding:17px 21px;min-width:250px;text-align:center;font:12px/1.8 system-ui,sans-serif}
.missing[hidden]{display:none}
.controls{display:flex;justify-content:center;gap:10px;margin:13px 0;flex-wrap:wrap}
.ab{display:flex;justify-content:center;gap:8px;margin:10px 0 4px;flex-wrap:wrap}.ab button{min-width:120px;padding:10px 14px}.ab button[aria-pressed="true"]{border-color:#fff7df;background:#d7e8f82a;box-shadow:0 0 15px #c6e7ff19;color:#fff9e9}
button{cursor:pointer;border-radius:9px;background:#ffebc915;color:#f9e9d3;border:1px solid #ffdfb054;font:12px system-ui,sans-serif;padding:12px 16px;min-width:95px}
button.primary{background:linear-gradient(130deg,#fff6df,#e4c895);color:#253044;border-color:#fff9e9;font-weight:700}
button:disabled{opacity:.43;cursor:default}
.settings{margin:16px auto 0;border:1px solid #ffe5b333;background:#121f30b9;border-radius:12px;padding:13px 18px;font:12px/1.8 system-ui,sans-serif}
.settings summary{cursor:pointer;color:#f8e5c3}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.grid label{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=file]{max-width:100%;font-size:11px}
input[type=range]{width:100%;accent-color:#e8cda0}
.small{font:11px/1.7 system-ui,sans-serif;color:#d7c4a6;margin-top:8px}
.status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:550px){.stage{height:65vh;min-height:430px}.grid{grid-template-columns:1fr}.wrap{width:98vw}.card{width:min(46vw,204px)}}

/* The approved full-card choreography: sunbeam forms first, then card descends from above.
   No card art, transparency or 1.42s shader shape is altered. */
.light-origin{position:absolute;left:50%;top:-114px;width:370px;height:260px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#fffffc 0,#fff4d7a9 17%,#fbdfac56 42%,transparent 70%);filter:blur(17px);opacity:0;pointer-events:none;z-index:2}
.light-core{position:absolute;left:50%;top:-10px;width:min(58vw,375px);height:100%;transform:translateX(-50%) scaleY(0);transform-origin:top center;background:linear-gradient(#fffefac7,#fff5d37a 38%,#fff4d126 74%,transparent);filter:blur(31px);opacity:0;pointer-events:none;z-index:2}
.card-halo{position:absolute;left:50%;top:54%;width:min(89vw,565px);height:min(100%,620px);transform:translate(-50%,-50%);background:radial-gradient(ellipse at 50% 50%,#fffdf471 0,#fff6df43 28%,#f0e9dc20 53%,transparent 77%);filter:blur(18px);mix-blend-mode:screen;opacity:0;pointer-events:none;z-index:2}
.beam{opacity:0;transform:translateX(-50%) scaleY(0);transform-origin:top center}
.pool{opacity:0}
.card{opacity:0;visibility:hidden;will-change:transform,opacity}
#snowCanvas{opacity:0}
</style></head>
<body><div class="wrap">
<header><div class="kicker">SCHICKSAL · THE ENCHANTED VASE · RARE CARD</div><h1>Solstice Dendrite</h1></header>
<section class="stage" id="stage" role="button" tabindex="0" aria-label="点击启动卡牌降临；悬停后点击演示翻牌动作">
<div class="ambient"></div>
<div id="lightOrigin" class="light-origin"></div><div class="beam" id="beam"></div>
<div id="lightCore" class="light-core"></div><div class="pool" id="pool"></div><div id="cardHalo" class="card-halo"></div>
<div class="card" id="card"><div class="spin" id="spin">
<div class="face back"><img id="back" class="background" alt=""><span id="anchor" class="core-anchor"></span></div>
<div class="face front"><img id="front" class="background" alt=""><img id="flower" class="flower" alt=""><div class="title-art"><img id="title" alt=""></div></div>
</div></div>
<canvas id="snowCanvas"></canvas><canvas id="fxCanvas" aria-hidden="true" hidden></canvas>
<span id="coreGuide"></span>
<div id="missing" class="missing">请导入已定稿四件套 ZIP<br>和珍珠暖白 Bruma PNG<br>开始完整降临与冰晶揭晓动画</div>
<div id="status" class="status" role="status" aria-live="polite"></div>
</section>
<div class="controls"><button id="play" class="primary" disabled>✦ Guess What?</button><button id="reset" disabled>重置 / 重播</button></div>
<details class="settings"><summary>素材与定位 · 只用于调试</summary>
<div class="grid">
<label>① 四件套原画 ZIP<input type="file" id="zipFile" accept=".zip,application/zip"></label>
<label>② 珍珠暖白 Bruma PNG<input type="file" id="brumaFile" accept="image/png,.png"></label>
<label>雪花核心横向位置<input id="coreX" type="range" min="43" max="57" step=".25" value="50"></label>
<label>雪花核心纵向位置<input id="coreY" type="range" min="43" max="57" step=".25" value="50"></label>
<label style="flex-direction:row;align-items:center"><input type="checkbox" id="showCore">显示核心定位标记</label>
</div><div id="assetMsg" class="small">卡牌动作单独调试：圣光降临 → 沿原对角轴旋转下降 → 悬停 → 点击后1.42秒翻牌。此版本不加载 GPU 冰晶爆发，雪幕继续自然飘落。进场点击画面可直接跳到悬停。</div>
</details></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage'),spin=$('spin'),card=$('card'),back=$('back'),front=$('front'),flower=$('flower'),title=$('title'),anchor=$('anchor'),guide=$('coreGuide'),missing=$('missing'),play=$('play'),resetBtn=$('reset'),assetMsg=$('assetMsg'),status=$('status');
const lightOrigin=$('lightOrigin'),beam=$('beam'),lightCore=$('lightCore'),pool=$('pool'),cardHalo=$('cardHalo');
const DEMO_MODE=document.documentElement.dataset.demoMode||'merged';
const LIGHT=.95,DROP=4.45,TRAVEL=355,START_TILT=-13.7,END_TILT=-4.8;
const snowCanvas=$('snowCanvas'),fxCanvas=$('fxCanvas'),snow=snowCanvas.getContext('2d',{alpha:true});
const assets={},files={},URLs={};
const names=['Card_Back.png','Card_Front.png','Flower_Bruma.png','Title_Solstice_Dendrite.png'];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const fade=(a,b,x)=>smooth((x-a)/(b-a));
let mode='idle',t=0,last=0,startAt=0,entryAt=0,raf=0,W=0,H=0,flakes=[],origin={x:0,y:0},maxRadius=1,glow=null,seed=3127541,iceDetail=false;
function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function ready(){let ok=!!assets[names[0]]&&!!assets[names[1]];play.disabled=!ok;resetBtn.disabled=!ok;missing.hidden=ok}
function applyImage(name,blob){
 if(URLs[name])URL.revokeObjectURL(URLs[name]);
 URLs[name]=URL.createObjectURL(blob);assets[name]=true;
 if(name===names[0])back.src=URLs[name];
 if(name===names[1])front.src=URLs[name];
 if(name===names[2])flower.src=URLs[name];
 if(name===names[3])title.src=URLs[name];
 ready();
}
async function unzip(file){
 const bytes=new Uint8Array(await file.arrayBuffer()),view=new DataView(bytes.buffer);
 let e=-1;
 for(let p=bytes.length-22;p>=Math.max(0,bytes.length-65558);p--)if(view.getUint32(p,true)===0x06054b50){e=p;break}
 if(e<0)throw Error('ZIP中央目录无法读取');
 let p=view.getUint32(e+16,true),n=view.getUint16(e+10,true),out={};
 for(let i=0;i<n;i++){
  if(view.getUint32(p,true)!==0x02014b50)throw Error('ZIP条目异常');
  const method=view.getUint16(p+10,true),size=view.getUint32(p+20,true),len=view.getUint16(p+28,true),extra=view.getUint16(p+30,true),comm=view.getUint16(p+32,true),local=view.getUint32(p+42,true);
  const name=new TextDecoder().decode(bytes.subarray(p+46,p+46+len)).split('/').pop();
  if(names.includes(name)){
   const a=local+30+view.getUint16(local+26,true)+view.getUint16(local+28,true),raw=bytes.slice(a,a+size);
   if(method===0)out[name]=new Blob([raw],{type:'image/png'});
   else if(method===8){
    let stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    out[name]=new Blob([await new Response(stream).arrayBuffer()],{type:'image/png'});
   }else throw Error('不支持ZIP压缩方法: '+method);
  }
  p+=46+len+extra+comm;
 }
 return out;
}
$('zipFile').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 assetMsg.textContent='读取原始素材中…';
 try{
  const result=await unzip(file);
  for(const name of names)if(result[name])applyImage(name,result[name]);
  assetMsg.textContent='原画已载入。可以点击爆发，也可以另选珍珠暖白 Bruma。';
 }catch(err){assetMsg.textContent='素材读取失败：'+err.message+'（也可以用Chrome打开此文件重试）'}
};
$('brumaFile').onchange=e=>{let f=e.target.files[0];if(f){applyImage(names[2],f);assetMsg.textContent='已经换成珍珠暖白 Bruma。'}};
for(const [id,prop] of [['coreX','left'],['coreY','top']])$(id).oninput=()=>{anchor.style[prop]=$(id).value+'%';refreshGuide()};
$('showCore').onchange=refreshGuide;
function getOrigin(){
 const a=anchor.getBoundingClientRect(),b=stage.getBoundingClientRect();
 return{x:a.left+a.width/2-b.left,y:a.top+a.height/2-b.top};
}
function refreshGuide(){
 if(!$('showCore').checked||mode==='burst'){guide.style.display='none';return}
 const p=getOrigin();guide.style.display='block';guide.style.left=p.x+'px';guide.style.top=p.y+'px';
}
function resize(){
 const rect=stage.getBoundingClientRect();W=rect.width;H=rect.height;
 const sr=Math.min(window.devicePixelRatio||1,1.5);
 snowCanvas.width=Math.max(1,Math.round(W*sr));
 snowCanvas.height=Math.max(1,Math.round(H*sr));
 snow.setTransform(sr,0,0,sr,0,0);
 if(DEMO_MODE==='merged')initGL();
 else {fxCanvas.width=1;fxCanvas.height=1;}
 if(mode==='idle')drawSnow(0,true);
 refreshGuide();
}
// Dendritic six-arm ice crystal: retain the silhouette, enhance the light INSIDE the arms.
function sixflake(ctx,x,y,size,rot,alpha,flash=0,enhanced=false,age=1){
 ctx.save();ctx.translate(x,y);
 if(enhanced){
  // A restrained cool, diffuse reflected-light halo, no star/diamond silhouette.
  const h=flash;
  const halo=ctx.createRadialGradient(0,0,size*.13,0,0,size*2.25);
  halo.addColorStop(0,'rgba(252,253,255,'+(0.10+h*.45).toFixed(3)+')');
  halo.addColorStop(.32,'rgba(219,240,255,'+(0.065+h*.23).toFixed(3)+')');
  halo.addColorStop(1,'rgba(212,235,252,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,size*2.25,0,Math.PI*2);ctx.fill();
 }
 ctx.rotate(rot);ctx.lineCap='round';ctx.lineJoin='round';
 // One identical six-arm geometry for both modes; only its optical treatment changes.
 ctx.beginPath();
 for(let i=0;i<6;i++){
  const a=i*Math.PI/3,c=Math.cos(a),d=Math.sin(a),px=-d,py=c;
  ctx.moveTo(0,0);ctx.lineTo(c*size,d*size);
  for(let j=1;j<=2;j++){
   const at=size*(j===1?.48:.74),side=size*(j===1?.26:.17);
   ctx.moveTo(c*at+px*side,d*at+py*side);ctx.lineTo(c*(at+side*.76),d*(at+side*.76));
   ctx.moveTo(c*at-px*side,d*at-py*side);ctx.lineTo(c*(at+side*.76),d*(at+side*.76));
  }
 }
 if(enhanced){
  ctx.save();ctx.strokeStyle='rgba(179,225,255,'+(alpha*.28+flash*.30).toFixed(3)+')';
  ctx.lineWidth=1.5+flash*.55;ctx.shadowColor='rgba(208,240,255,.8)';
  ctx.shadowBlur=2.1+flash*4.5;ctx.stroke();ctx.restore();
 }
 ctx.strokeStyle='rgba(247,253,255,'+Math.min(1,alpha+flash*.23).toFixed(3)+')';
 ctx.lineWidth=enhanced?1.14+flash*.25:.85;
 ctx.shadowColor=enhanced?'rgba(243,250,255,.7)':'rgba(238,251,255,.8)';
 ctx.shadowBlur=enhanced?1.2+flash*2.7:flash*4.2;ctx.stroke();
 if(enhanced&&flash>.014){
  // A moving specular highlight runs outward along the EXISTING six branches.
  // Tiny cool/warm separation simulates ice refraction without polygon shards.
  const travel=Math.max(0,Math.min(1,(age-.018)/.27));
  for(let i=0;i<6;i++){
   const a=i*Math.PI/3, c=Math.cos(a),d=Math.sin(a);
   const shift=.045*i,local=Math.max(0,Math.min(1,(travel-shift)/(1-shift)));
   const center=size*(.13+.75*local), length=size*(.18-.06*local);
   const from=Math.max(0,center-length*.5),to=Math.min(size,center+length*.5);
   const tint=i%3===0?'rgba(255,245,228,':'rgba(222,244,255,';
   ctx.beginPath();ctx.moveTo(c*from-.35,d*from+.20);ctx.lineTo(c*to-.35,d*to+.20);
   ctx.lineWidth=2.0*flash;ctx.strokeStyle=tint+(flash*.55).toFixed(3)+')';
   ctx.shadowBlur=3.4*flash;ctx.shadowColor='#e7f6ff';ctx.stroke();
   ctx.beginPath();ctx.moveTo(c*from,d*from);ctx.lineTo(c*to,d*to);
   ctx.lineWidth=.78;ctx.strokeStyle='rgba(255,255,253,'+(flash*.93).toFixed(3)+')';
   ctx.shadowBlur=2*flash;ctx.shadowColor='#fff';ctx.stroke();
  }
  // Small central optical sparkle, round not diamond-shaped.
  ctx.beginPath();ctx.arc(0,0,1.05+flash*.6,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,252,'+(flash*.75).toFixed(3)+')';
  ctx.shadowBlur=3*flash;ctx.fill();
 }
 ctx.restore();
}
function initSnow(){
 seed=3127541;flakes=[];
 for(let i=0;i<103;i++){
  const crystal=i%7===0||i%13===0;
  flakes.push({x:rand()*W,y:rand()*H,vy:crystal?16+rand()*31:28+rand()*61,
   dx:3+rand()*11,period:.5+rand(),phase:rand()*6.283,
   crystal,angle:rand()*6.283,omega:(rand()-.5)*.26,
   size:crystal?4.5+rand()*5.8:.55+rand()*1.5,opacity:.25+rand()*.65,
   frozen:false,freezeX:0,freezeY:0,freezeAngle:0,freezeAt:-10,time:0});
 }
}
function snowStep(dt,radius){
 for(const f of flakes){
  if(f.frozen)continue;
  f.time+=dt;f.y+=f.vy*dt;f.angle+=f.omega*dt;
  if(f.y>H+13){f.y=-13;f.x=rand()*W}
  const x=f.x+Math.sin(f.time*f.period+f.phase)*f.dx;
  if(radius>=0&&Math.hypot(x-origin.x,f.y-origin.y)<=radius){
   f.frozen=true;f.freezeX=x;f.freezeY=f.y;f.freezeAngle=f.angle;f.freezeAt=t;
  }
 }
}
// Radially aligned refraction: source -> individual flake -> outward light.
// Draw on the snow canvas, *not* the GPU burst canvas, so the streak stays attached
// to each snowflake as the wave freezes it. Rays have no independent random angle.
function drawSnow(dt,still){
 if(!snow)return;
 snow.clearRect(0,0,W,H);
 for(const f of flakes){
  const x=f.frozen?f.freezeX:f.x+Math.sin(f.time*f.period+f.phase)*f.dx;
  const y=f.frozen?f.freezeY:f.y;
  const rot=f.frozen?f.freezeAngle:f.angle;
  const age=f.frozen?Math.max(0,t-f.freezeAt):1;
  // A short optical impulse after the freeze front touches this specific snowflake.
  const flash=false&&iceDetail&&f.frozen&&age<.46
   ? Math.min(1,age/.055)*(1-smooth((age-.12)/.34))
   :0;
  // Draw the large radial halo behind the crystal, then its finer internal branches.
  // No burst-attached refraction in the motion-only edition.
  if(f.crystal){
   const brightness=iceDetail?Math.min(1,.64+f.opacity*.43):f.opacity;
   sixflake(snow,x,y,f.size,rot,brightness,flash,iceDetail,age);
  }else{
   const brightness=iceDetail?Math.min(1,.38+f.opacity*.72):f.opacity;
   if(flash>.025){
    // Dot snow has a brief pearly round glimmer in addition to a radial trail.
    const g=snow.createRadialGradient(x,y,0,x,y,Math.max(5,f.size*4.5));
    g.addColorStop(0,'rgba(255,255,250,'+(.42*flash).toFixed(3)+')');
    g.addColorStop(.4,'rgba(207,234,255,'+(.17*flash).toFixed(3)+')');
    g.addColorStop(1,'rgba(207,234,255,0)');
    snow.fillStyle=g;snow.beginPath();snow.arc(x,y,Math.max(5,f.size*4.5),0,Math.PI*2);snow.fill();
   }
   snow.fillStyle='rgba(255,254,250,'+Math.min(1,brightness+flash*.35).toFixed(3)+')';
   snow.beginPath();snow.arc(x,y,f.size,0,Math.PI*2);snow.fill();
  }
 }
}
// Card motion-only edition: no GPU effect renderer, no bloom passes.
function paintGlow(time){}
function pose(t){
 const k=smooth((t-.22)/(1.42-.22));
 spin.style.transform='rotateZ('+END_TILT+'deg) rotate3d(.5547,-.83205,0,'+(720+180*k).toFixed(3)+'deg)';
}
function sunLight(value){
 const p=1-Math.pow(1-clamp(value),3);
 lightOrigin.style.opacity=String(.93*p);
 beam.style.opacity=String(.79*p);
 beam.style.transform='translateX(-50%) scaleY('+Math.max(.0001,p)+')';
 lightCore.style.opacity=String(.75*p);
 lightCore.style.transform='translateX(-50%) scaleY('+Math.max(.0001,p)+')';
 pool.style.opacity=String(.7*p);
 cardHalo.style.opacity=String(.64*p);
}
function cardPose(deg,tilt,y,scale,opacity){
 card.style.visibility='visible';card.style.opacity=String(opacity);
 card.style.transform='translate(-50%,-50%) translateY('+y.toFixed(3)+'px) scale('+scale.toFixed(4)+')';
 spin.style.transform='rotateZ('+tilt.toFixed(3)+'deg) rotate3d(.5547,-.83205,0,'+deg.toFixed(3)+'deg)';
}
function hover(){
 mode='hover';sunLight(1);cardPose(720,END_TILT,0,1,1);
 snowCanvas.style.opacity='1';refreshGuide();
 play.textContent='✦ 点击卡牌揭晓';
 status.textContent='卡牌悬停，点击揭晓';
}
function entrance(){
 if(play.disabled)return;
 idle();mode='entrance';entryAt=0;last=0;
 play.textContent='✦ 跳到悬停';
 status.textContent='圣光降临，卡牌旋转下降';
 raf=requestAnimationFrame(tick);
}
function idle(){
 cancelAnimationFrame(raf);mode='ready';t=0;last=0;startAt=0;entryAt=0;
 card.style.visibility='hidden';card.style.opacity='0';
 card.style.transform='translate(-50%,-50%) translateY(-355px) scale(.72)';
 spin.style.transform='rotateZ(-13.7deg)';
 sunLight(0);snowCanvas.style.opacity='0';
 if(!W||!H)resize();
 initSnow();origin=getOrigin();
 if(DEMO_MODE==='merged')paintGlow(1.42);
 else fxCanvas.style.opacity='0';
 drawSnow(0,true);guide.style.display='none';
 play.textContent='✦ Guess What?';
 status.textContent='点击开始完整卡牌降临动画';
}
function freezeRadius(time){
 if(time<.19)return -1;
 const p=smooth((time-.19)/(.98-.19));
 return maxRadius*p;
}
function explode(){
 if(play.disabled||mode!=='hover')return;
 cancelAnimationFrame(raf);mode='burst';t=0;last=0;startAt=0;
 origin=getOrigin();
 maxRadius=Math.max(Math.hypot(origin.x,origin.y),Math.hypot(W-origin.x,origin.y),Math.hypot(origin.x,H-origin.y),Math.hypot(W-origin.x,H-origin.y))+30;
 guide.style.display='none';status.textContent='1.42 秒冰晶揭晓';
 raf=requestAnimationFrame(tick);
}
function tick(now){
 if(!last)last=now;
 const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;
 if(mode==='entrance'){
  if(!entryAt)entryAt=now;
  const elapsed=(now-entryAt)/1000;
  if(elapsed<LIGHT){
   sunLight(elapsed/LIGHT);snowCanvas.style.opacity='0';
  }else{
   sunLight(1);snowStep(dt,-1);
   const p=clamp((elapsed-LIGHT)/DROP);
   const eased=1-Math.pow(1-p,3);
   const recover=smooth((p-.72)/.28);
   const tilt=START_TILT+(END_TILT-START_TILT)*recover;
   const travelled=1-Math.pow(1-p,1.7);
   cardPose(720*eased,tilt,-TRAVEL*(1-travelled),.72+.28*travelled,clamp(p*3.7));
   snowCanvas.style.opacity=String(smooth(p*2.9));
   drawSnow(dt,false);
   if(p>=1){hover();}
  }
 }else if(mode==='hover'){
  snowStep(dt,-1);drawSnow(dt,false);
 }else if(mode==='burst'){
  if(!startAt)startAt=now;
  t=Math.min(1.42,(now-startAt)/1000);
  snowStep(dt,DEMO_MODE==='merged'?freezeRadius(t):-1);
  pose(t);
  if(DEMO_MODE==='merged')paintGlow(t);
  drawSnow(dt,false);
  const lightLeft=1-smooth(t);
  // The already-established sunbeam softly fades behind the reveal.
  lightOrigin.style.opacity=String(.10+.83*lightLeft);
  beam.style.opacity=String(.08+.71*lightLeft);
  lightCore.style.opacity=String(.06+.69*lightLeft);
  pool.style.opacity=String(.20+.50*lightLeft);
  cardHalo.style.opacity=String(.16+.48*lightLeft);
  if(t>=1.42){
   if(DEMO_MODE==='merged'){
    for(const f of flakes){if(!f.frozen){
     f.frozen=true;f.freezeX=f.x+Math.sin(f.time*f.period+f.phase)*f.dx;
     f.freezeY=f.y;f.freezeAngle=f.angle;f.freezeAt=-10;
    }}
    drawSnow(0,true);
   }
   mode='done';status.textContent='卡牌揭晓完成';
   play.textContent='✦ 再次播放完整动画';
   if(DEMO_MODE==='card')raf=requestAnimationFrame(tick);
   return;
  }
 }else if(mode==='done'){
  if(DEMO_MODE==='card'){snowStep(dt,-1);drawSnow(dt,false);}
  else return;
 }else return;
 raf=requestAnimationFrame(tick);
}
function stageAction(){
 if(play.disabled||mode==='burst')return;
 if(mode==='entrance'){
  cancelAnimationFrame(raf);sunLight(1);snowCanvas.style.opacity='1';
  // Skip only the entrance; do not skip the click-to-reveal burst.
  hover();last=0;raf=requestAnimationFrame(tick);return;
 }
 if(mode==='hover'){explode();return;}
 if(mode==='ready'||mode==='done'){entrance();}
}
stage.onclick=stageAction;
stage.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();stageAction()}};
play.onclick=stageAction;resetBtn.onclick=()=>idle();
window.addEventListener('resize',()=>{
 resize();
 if(mode!=='burst')idle();
});
resize();idle();
})();
</script></body></html>
