<script id="vertSrc" type="x-shader/x-vertex">#version 300 es
precision highp float;
out vec2 vUV;
void main(){
vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
vUV=p; // Fullscreen triangle UV spans visible 0..1, not 0..0.5.
gl_Position=vec4(p*2.0-1.,0.,1.);
}
</script>
<script id="effectSrc" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vUV;
out vec4 frag;
uniform vec2 uRes;
uniform vec2 uCenter;
uniform float uTime;
uniform float uMaxR;
uniform float uIce;
float sat(float x){return clamp(x,0.,1.);}
float sm(float a,float b,float x){return smoothstep(a,b,x);}
float hash(float x){return fract(sin(x*127.1)*43758.5453);}
void main(){
vec2 p=gl_FragCoord.xy-uCenter;
float r=length(p);
float a=atan(p.y,p.x);
float t=uTime;
float ign=sm(0.015,.12,t)*(1.-sm(.22,.53,t));
float eruption=sm(.105,.26,t)*(1.-sm(.40,1.28,t));
float glow=sm(.08,.19,t)*(1.-sm(.75,1.42,t));
float spread=sm(.105,.52,t);
float radius=30.+uMaxR*.9*spread;
float x=r/(radius+1.);
float d=sat(1.-x);
float six=abs(cos(a*3.0+sin(a*6.0)*.03));
float sixSharp=pow(six,30.);
float side=pow(max(0.,cos(a*10.7+sin(a*6.)*.9+sin(a*15.3)*.22)),28.);
float glint=pow(max(0.,cos(a*22.3+sin(a*6.)*.52)),75.);
float envelope=sm(0.0,.14,x)*(1.-sm(.48,1.04,x));
float broken=.63+.37*sin(a*17.3+sin(a*7.2)*1.7);
float caustic=pow(abs(sin(a*5.8+sin(r*.015-t*2.)*.18)),13.)*(.55+.45*cos(a*11.));
float prism=(sixSharp*.94+side*.43+glint*.12+caustic*.27)*envelope*broken;
float farShard=pow(six,66.)*exp(-r/(uMaxR*.70))*spread;
float core=exp(-pow(r/(12.+spread*17.),1.18))*ign;
float hot=exp(-pow(r/(15.+spread*57.),1.38))*eruption;
float halo=exp(-pow(r/(90.+spread*205.),1.37))*glow;
float facets=(prism*.92+farShard*.29)*eruption;
float warm=hot*.84+halo*.23+facets*.25;
float cold=halo*.40+facets*.53;
vec3 rgb=vec3(1.,.985,.946)*(hot*.85+core*1.15)+vec3(.98,.9,.76)*warm+vec3(.67,.86,1.)*cold;
rgb+=vec3(.97,.98,1.)*facets*.66;
float waveStart=sm(.18,.205,t);
float waveProgress=sm(.19,1.02,t);
float waveR=uMaxR*waveProgress;
float distort=1.+.016*sin(a*6.0)+.008*sin(a*13.0+1.);
float edge=abs(r-waveR*distort);
float rim=exp(-pow(edge/13.,2.0))*.12*waveStart*(1.-sm(.98,1.32,t));
rgb+=vec3(.77,.91,1.)*rim;
// Micro-ice option: no large polygon facets and no change to V1's central explosion.
// A very small sixfold ice conduction glimmer lives only within the medallion.
float coreArms=exp(-pow((sin(a*3.0)*r)/1.55,2.0))
  *sm(3.0,8.0,r)*(1.0-sm(27.0,38.0,r));
float coreSweep=sm(0.0,.16,t)*(1.0-sm(.17,.30,t));
float tinyIce=coreArms*coreSweep*.37;
// Just two brief, barely perceptible refractive glints along EXISTING light;
 // they do not spawn geometric shapes or extra particles.
float glintA=exp(-pow((a-.38)/.045,2.0))
 *exp(-pow((r-(45.0+260.0*t))/47.0,2.0));
float glintB=exp(-pow((a+2.26)/.035,2.0))
 *exp(-pow((r-(36.0+195.0*t))/35.0,2.0));
float glintLife=sm(.13,.23,t)*(1.0-sm(.37,.61,t));
float iceLight=(glintA*.11+glintB*.08)*glintLife+tinyIce;
rgb+=uIce*iceLight*vec3(.90,.97,1.0);
float alpha=sat(core*.8+hot*.83+halo*.41+facets*.84+rim+uIce*iceLight*.7);
float end=1.-sm(1.24,1.42,t);
frag=vec4(rgb*end,alpha*end);
}
</script>
<script id="bloomSrc" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vUV;
out vec4 frag;
uniform sampler2D uTex;
uniform vec2 uTexel;
void main(){
vec4 c=texture(uTex,vUV);
vec4 b=vec4(0.);
float w=0.;
for(int i=-3;i<=3;i++){
 for(int j=-3;j<=3;j++){
  float f=exp(-float(i*i+j*j)/5.0);
  b+=texture(uTex,vUV+vec2(float(i),float(j))*uTexel*3.3)*f;
  w+=f;
 }
}
b/=w;
vec3 col=c.rgb+b.rgb*.58;
float a=clamp(c.a+b.a*.37,0.,1.);
frag=vec4(col,a);
}
</script>
<script>
(function(){

async function unzip(file){
 const bytes=new Uint8Array(await file.arrayBuffer()),view=new DataView(bytes.buffer);
 let e=-1;
 for(let p=bytes.length-22;p>=Math.max(0,bytes.length-65558);p--)if(view.getUint32(p,true)===0x06054b50){e=p;break}
 if(e<0)throw Error('ZIP中央目录无法读取');
 let p=view.getUint32(e+16,true),n=view.getUint16(e+10,true),out={};
 for(let i=0;i<n;i++){
  if(view.getUint32(p,true)!==0x02014b50)throw Error('ZIP条目异常');
  const method=view.getUint16(p+10,true),size=view.getUint32(p+20,true),len=view.getUint16(p+28,true),extra=view.getUint16(p+30,true),comm=view.getUint16(p+32,true),local=view.getUint32(p+42,true);
  const name=new TextDecoder().decode(bytes.subarray(p+46,p+46+len)).split('/').pop();
  if(names.includes(name)){
   const a=local+30+view.getUint16(local+26,true)+view.getUint16(local+28,true),raw=bytes.slice(a,a+size);
   if(method===0)out[name]=new Blob([raw],{type:'image/png'});
   else if(method===8){
    let stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    out[name]=new Blob([await new Response(stream).arrayBuffer()],{type:'image/png'});
   }else throw Error('不支持ZIP压缩方法: '+method);
  }
  p+=46+len+extra+comm;
 }

}

// Dendritic six-arm ice crystal: retain the silhouette, enhance the light INSIDE the arms.
function sixflake(ctx,x,y,size,rot,alpha,flash=0,enhanced=false,age=1){
 ctx.save();ctx.translate(x,y);
 if(enhanced){
  // A restrained cool, diffuse reflected-light halo, no star/diamond silhouette.

  const halo=ctx.createRadialGradient(0,0,size*.13,0,0,size*2.25);
  halo.addColorStop(0,'rgba(252,253,255,'+(0.10+h*.45).toFixed(3)+')');
  halo.addColorStop(.32,'rgba(219,240,255,'+(0.065+h*.23).toFixed(3)+')');

 }

 // One identical six-arm geometry for both modes; only its optical treatment changes.

   const at=size*(j===1?.48:.74),side=size*(j===1?.26:.17);
   ctx.moveTo(c*at+px*side,d*at+py*side);ctx.lineTo(c*(at+side*.76),d*(at+side*.76));
   ctx.moveTo(c*at-px*side,d*at-py*side);ctx.lineTo(c*(at+side*.76),d*(at+side*.76));

 }
 ctx.strokeStyle='rgba(247,253,255,'+Math.min(1,alpha+flash*.23).toFixed(3)+')';
 ctx.lineWidth=enhanced?1.14+flash*.25:.85;
 ctx.shadowColor=enhanced?'rgba(243,250,255,.7)':'rgba(238,251,255,.8)';
 ctx.shadowBlur=enhanced?1.2+flash*2.7:flash*4.2;ctx.stroke();
 if(enhanced&&flash>.014){
  // A moving specular highlight runs outward along the EXISTING six branches.
  // Tiny cool/warm separation simulates ice refraction without polygon shards.
  const travel=Math.max(0,Math.min(1,(age-.018)/.27));
  for(let i=0;i<6;i++){
   const a=i*Math.PI/3, c=Math.cos(a),d=Math.sin(a);
   const shift=.045*i,local=Math.max(0,Math.min(1,(travel-shift)/(1-shift)));
   const center=size*(.13+.75*local), length=size*(.18-.06*local);
   const from=Math.max(0,center-length*.5),to=Math.min(size,center+length*.5);
   const tint=i%3===0?'rgba(255,245,228,':'rgba(222,244,255,';
   ctx.beginPath();ctx.moveTo(c*from-.35,d*from+.20);ctx.lineTo(c*to-.35,d*to+.20);
   ctx.lineWidth=2.0*flash;ctx.strokeStyle=tint+(flash*.55).toFixed(3)+')';
   ctx.shadowBlur=3.4*flash;ctx.shadowColor='#e7f6ff';ctx.stroke();
   ctx.beginPath();ctx.moveTo(c*from,d*from);ctx.lineTo(c*to,d*to);
   ctx.lineWidth=.78;ctx.strokeStyle='rgba(255,255,253,'+(flash*.93).toFixed(3)+')';
   ctx.shadowBlur=2*flash;ctx.shadowColor='#fff';ctx.stroke();
  }
  // Small central optical sparkle, round not diamond-shaped.
  ctx.beginPath();ctx.arc(0,0,1.05+flash*.6,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,252,'+(flash*.75).toFixed(3)+')';
  ctx.shadowBlur=3*flash;ctx.fill();
 }
 ctx.restore();
}
function initSnow(){
 seed=3127541;flakes=[];
 for(let i=0;i<103;i++){
  const crystal=i%7===0||i%13===0;
  flakes.push({x:rand()*W,y:rand()*H,vy:crystal?16+rand()*31:28+rand()*61,
   dx:3+rand()*11,period:.5+rand(),phase:rand()*6.283,
   crystal,angle:rand()*6.283,omega:(rand()-.5)*.26,
   size:crystal?4.5+rand()*5.8:.55+rand()*1.5,opacity:.25+rand()*.65,
   frozen:false,freezeX:0,freezeY:0,freezeAngle:0,freezeAt:-10,time:0});
 }
}
function snowStep(dt,radius){
 for(const f of flakes){
  if(f.frozen)continue;
  f.time+=dt;f.y+=f.vy*dt;f.angle+=f.omega*dt;
  if(f.y>H+13){f.y=-13;f.x=rand()*W}
  const x=f.x+Math.sin(f.time*f.period+f.phase)*f.dx;
  if(radius>=0&&Math.hypot(x-origin.x,f.y-origin.y)<=radius){
   f.frozen=true;f.freezeX=x;f.freezeY=f.y;f.freezeAngle=f.angle;f.freezeAt=t;
  }
 }
}
// Radially aligned refraction: source -> individual flake -> outward light.
// Draw on the snow canvas, *not* the GPU burst canvas, so the streak stays attached
// to each snowflake as the wave freezes it. Rays have no independent random angle.
function drawRadialRefraction(ctx,x,y,flake,pulse,age){
 if(pulse<=.014)return;
 const dx=x-origin.x,dy=y-origin.y,len=Math.hypot(dx,dy);
 const theta=len>1e-3?Math.atan2(dy,dx):0;
 const crystal=flake.crystal;
 const size=flake.size;
 // Main crystal rays extend substantially beyond the physical crystal.
 // Dot snow receives a shorter, softer optical trail.
 const out=crystal?Math.min(66,29+size*2.8):Math.min(30,13+size*6.0);
 const back=crystal?Math.min(18,7+size*.82):Math.min(10,4+size*2.2);
 const spread=crystal?Math.min(12,4.5+size*.83):Math.min(7,2.3+size*1.9);
 const opening=.56+.44*Math.min(1,age/.14);
 const tip=out*opening,tail=back*(.82+.18*opening);
 const intensity=pulse*(crystal?1:.66);
 ctx.save();ctx.translate(x,y);ctx.rotate(theta);
 // A diffuse long-axis pearl-blue veil: the optical envelope, not a hard line.
 ctx.save();ctx.scale(1,spread/Math.max(out,1));
 const veil=ctx.createRadialGradient(tip*.16,0,.4,tip*.16,0,out*.92);
 veil.addColorStop(0,'rgba(248,252,255,'+(.42*intensity).toFixed(3)+')');
 veil.addColorStop(.33,'rgba(210,235,255,'+(.24*intensity).toFixed(3)+')');
 veil.addColorStop(.72,'rgba(205,231,252,'+(.095*intensity).toFixed(3)+')');
 veil.addColorStop(1,'rgba(208,237,255,0)');
 ctx.fillStyle=veil;ctx.beginPath();ctx.ellipse(tip*.16,0,out*.92,out*.78,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
 // A translucent taper continuing outward in exactly the incident ray direction.
 const grad=ctx.createLinearGradient(-tail,0,tip,0);
 grad.addColorStop(0,'rgba(240,247,255,0)');
 grad.addColorStop(.18,'rgba(235,248,255,'+(.13*intensity).toFixed(3)+')');
 grad.addColorStop(.31,'rgba(255,253,244,'+(.45*intensity).toFixed(3)+')');
 grad.addColorStop(.56,'rgba(219,242,255,'+(.33*intensity).toFixed(3)+')');
 grad.addColorStop(.84,'rgba(209,235,255,'+(.09*intensity).toFixed(3)+')');
 grad.addColorStop(1,'rgba(209,235,255,0)');
 ctx.fillStyle=grad;ctx.beginPath();
 ctx.moveTo(-tail,0);
 ctx.bezierCurveTo(-tail*.1,-spread*.74,tip*.36,-spread*.65,tip,-spread*.07);
 ctx.quadraticCurveTo(tip+.8,0,tip,spread*.07);
 ctx.bezierCurveTo(tip*.48,spread*.62,-tail*.05,spread*.52,-tail,0);
 ctx.fill();
 // Clean narrow specular center: sharper on ice crystals, fades to transparent.
 const line=ctx.createLinearGradient(-tail*.45,0,tip*.85,0);
 line.addColorStop(0,'rgba(255,251,240,0)');
 line.addColorStop(.22,'rgba(255,252,245,'+(.69*intensity).toFixed(3)+')');
 line.addColorStop(.43,'rgba(250,254,255,'+(.89*intensity).toFixed(3)+')');
 line.addColorStop(.76,'rgba(235,249,255,'+(.33*intensity).toFixed(3)+')');
 line.addColorStop(1,'rgba(222,242,255,0)');
 ctx.strokeStyle=line;ctx.lineWidth=crystal?1.55:.87;
 ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-tail*.45,0);ctx.lineTo(tip*.85,0);ctx.stroke();
 if(crystal){
  // Subtle refractive split on the OUTWARD side only, not two opposing spikes.
  ctx.strokeStyle='rgba(215,239,255,'+(.32*intensity).toFixed(3)+')';
  ctx.lineWidth=.85;ctx.beginPath();
  ctx.moveTo(size*.28,-1.9);ctx.quadraticCurveTo(tip*.45,-2.8,tip*.78,-1.0);ctx.stroke();
  ctx.strokeStyle='rgba(255,244,224,'+(.17*intensity).toFixed(3)+')';
  ctx.beginPath();ctx.moveTo(size*.3,1.5);ctx.quadraticCurveTo(tip*.52,1.9,tip*.65,.65);ctx.stroke();
 }
 ctx.restore();
}

function drawSnow(dt,still){
 if(!snow)return;
 snow.clearRect(0,0,W,H);
 for(const f of flakes){
  const x=f.frozen?f.freezeX:f.x+Math.sin(f.time*f.period+f.phase)*f.dx;
  const y=f.frozen?f.freezeY:f.y;
  const rot=f.frozen?f.freezeAngle:f.angle;
  const age=f.frozen?Math.max(0,t-f.freezeAt):1;
  // A short optical impulse after the freeze front touches this specific snowflake.
  const flash=iceDetail&&f.frozen&&age<.46
   ? Math.min(1,age/.055)*(1-smooth((age-.12)/.34))
   :0;
  // Draw the large radial halo behind the crystal, then its finer internal branches.
  if(flash>.014)drawRadialRefraction(snow,x,y,f,flash,age);
  if(f.crystal){
   const brightness=iceDetail?Math.min(1,.64+f.opacity*.43):f.opacity;
   sixflake(snow,x,y,f.size,rot,brightness,flash,iceDetail,age);
  }else{
   const brightness=iceDetail?Math.min(1,.38+f.opacity*.72):f.opacity;
   if(flash>.025){
    // Dot snow has a brief pearly round glimmer in addition to a radial trail.
    const g=snow.createRadialGradient(x,y,0,x,y,Math.max(5,f.size*4.5));
    g.addColorStop(0,'rgba(255,255,250,'+(.42*flash).toFixed(3)+')');
    g.addColorStop(.4,'rgba(207,234,255,'+(.17*flash).toFixed(3)+')');
    g.addColorStop(1,'rgba(207,234,255,0)');
    snow.fillStyle=g;snow.beginPath();snow.arc(x,y,Math.max(5,f.size*4.5),0,Math.PI*2);snow.fill();
   }
   snow.fillStyle='rgba(255,254,250,'+Math.min(1,brightness+flash*.35).toFixed(3)+')';
   snow.beginPath();snow.arc(x,y,f.size,0,Math.PI*2);snow.fill();
  }
 }
}
function shader(gl,type,src){
 const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);
 if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));
 return sh;
}
function program(gl,vert,frag){
 const p=gl.createProgram();
 gl.attachShader(p,shader(gl,gl.VERTEX_SHADER,vert));
 gl.attachShader(p,shader(gl,gl.FRAGMENT_SHADER,frag));
 gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
 return p;
}
function initGL(){
 if(glow&&glow.gl){const g=glow.gl;g.deleteTexture(glow.texture);g.deleteFramebuffer(glow.fbo);g.deleteProgram(glow.effect);g.deleteProgram(glow.bloom)}
 let gl;
 try{gl=fxCanvas.getContext('webgl2',{alpha:true,antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:false});}
 catch(err){gl=null}
 if(!gl){glow={gl:null};assetMsg.textContent='本浏览器不支持 WebGL2：可尝试最新Safari或Chrome。';return}
 const dpr=Math.min(window.devicePixelRatio||1,1.5)*.72;
 const width=Math.max(1,Math.round(W*dpr)),height=Math.max(1,Math.round(H*dpr));
 fxCanvas.width=width;fxCanvas.height=height;
 gl.viewport(0,0,width,height);
 try{
  const effect=program(gl,$('vertSrc').textContent,$('effectSrc').textContent);
  const bloom=program(gl,$('vertSrc').textContent,$('bloomSrc').textContent);
  const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,width,height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Framebuffer failed');
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  glow={gl,effect,bloom,texture,fbo,width,height};
 }catch(err){glow={gl:null};assetMsg.textContent='GPU着色器启动失败：'+err.message}
}
function paintGlow(time){
 if(!glow||!glow.gl)return;
 const {gl,effect,bloom,fbo,texture,width,height}=glow;
 const sx=width/W,sy=height/H,ox=origin.x*sx,oy=(H-origin.y)*sy;
 const mr=maxRadius*Math.max(sx,sy);
 gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,width,height);
 gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.useProgram(effect);
 gl.uniform2f(gl.getUniformLocation(effect,'uRes'),width,height);
 gl.uniform2f(gl.getUniformLocation(effect,'uCenter'),ox,oy);
 gl.uniform1f(gl.getUniformLocation(effect,'uTime'),time);
 gl.uniform1f(gl.getUniformLocation(effect,'uMaxR'),mr);
 gl.uniform1f(gl.getUniformLocation(effect,'uIce'),iceDetail?1:0);
 gl.drawArrays(gl.TRIANGLES,0,3);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.useProgram(bloom);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texture);
 gl.uniform1i(gl.getUniformLocation(bloom,'uTex'),0);
 gl.uniform2f(gl.getUniformLocation(bloom,'uTexel'),1/width,1/height);
 gl.drawArrays(gl.TRIANGLES,0,3);
}
function pose(t){
 const k=smooth((t-.22)/(1.42-.22));
 spin.style.transform='rotateZ('+END_TILT+'deg) rotate3d(.5547,-.83205,0,'+(720+180*k).toFixed(3)+'deg)';
}
function sunLight(value){
 const p=1-Math.pow(1-clamp(value),3);
 lightOrigin.style.opacity=String(.93*p);
 beam.style.opacity=String(.79*p);
 beam.style.transform='translateX(-50%) scaleY('+Math.max(.0001,p)+')';
 lightCore.style.opacity=String(.75*p);
 lightCore.style.transform='translateX(-50%) scaleY('+Math.max(.0001,p)+')';
 pool.style.opacity=String(.7*p);
 cardHalo.style.opacity=String(.64*p);
}
function cardPose(deg,tilt,y,scale,opacity){
 card.style.visibility='visible';card.style.opacity=String(opacity);
 card.style.transform='translate(-50%,-50%) translateY('+y.toFixed(3)+'px) scale('+scale.toFixed(4)+')';
 spin.style.transform='rotateZ('+tilt.toFixed(3)+'deg) rotate3d(.5547,-.83205,0,'+deg.toFixed(3)+'deg)';
}
function hover(){
 mode='hover';sunLight(1);cardPose(720,END_TILT,0,1,1);
 snowCanvas.style.opacity='1';refreshGuide();
 play.textContent='✦ 点击卡牌揭晓';
 status.textContent='卡牌悬停，点击揭晓';
}
function entrance(){
 if(play.disabled)return;
 idle();mode='entrance';entryAt=0;last=0;
 play.textContent='✦ 跳到悬停';
 status.textContent='圣光降临，卡牌旋转下降';
 raf=requestAnimationFrame(tick);
}
function idle(){
 cancelAnimationFrame(raf);mode='ready';t=0;last=0;startAt=0;entryAt=0;
 card.style.visibility='hidden';card.style.opacity='0';
 card.style.transform='translate(-50%,-50%) translateY(-355px) scale(.72)';
 spin.style.transform='rotateZ(-13.7deg)';
 sunLight(0);snowCanvas.style.opacity='0';
 if(!W||!H)resize();
 initSnow();origin=getOrigin();
 if(DEMO_MODE==='merged')paintGlow(1.42);
 else fxCanvas.style.opacity='0';
 drawSnow(0,true);guide.style.display='none';
 play.textContent='✦ Guess What?';
 status.textContent='点击开始完整卡牌降临动画';
}
function freezeRadius(time){
 if(time<.19)return -1;
 const p=smooth((time-.19)/(.98-.19));
 return maxRadius*p;
}
function explode(){
 if(play.disabled||mode!=='hover')return;
 cancelAnimationFrame(raf);mode='burst';t=0;last=0;startAt=0;
 origin=getOrigin();
 maxRadius=Math.max(Math.hypot(origin.x,origin.y),Math.hypot(W-origin.x,origin.y),Math.hypot(origin.x,H-origin.y),Math.hypot(W-origin.x,H-origin.y))+30;
 guide.style.display='none';status.textContent='1.42 秒冰晶揭晓';
 raf=requestAnimationFrame(tick);
}
function tick(now){
 if(!last)last=now;
 const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;
 if(mode==='entrance'){
  if(!entryAt)entryAt=now;
  const elapsed=(now-entryAt)/1000;
  if(elapsed<LIGHT){
   sunLight(elapsed/LIGHT);snowCanvas.style.opacity='0';
  }else{
   sunLight(1);snowStep(dt,-1);
   const p=clamp((elapsed-LIGHT)/DROP);
   const eased=1-Math.pow(1-p,3);
   const recover=smooth((p-.72)/.28);
   const tilt=START_TILT+(END_TILT-START_TILT)*recover;
   const travelled=1-Math.pow(1-p,1.7);
   cardPose(720*eased,tilt,-TRAVEL*(1-travelled),.72+.28*travelled,clamp(p*3.7));
   snowCanvas.style.opacity=String(smooth(p*2.9));
   drawSnow(dt,false);
   if(p>=1){hover();}
  }
 }else if(mode==='hover'){
  snowStep(dt,-1);drawSnow(dt,false);
 }else if(mode==='burst'){
  if(!startAt)startAt=now;
  t=Math.min(1.42,(now-startAt)/1000);
  snowStep(dt,DEMO_MODE==='merged'?freezeRadius(t):-1);
  pose(t);
  if(DEMO_MODE==='merged')paintGlow(t);
  drawSnow(dt,false);
  const lightLeft=1-smooth(t);
  // The already-established sunbeam softly fades behind the reveal.
  lightOrigin.style.opacity=String(.10+.83*lightLeft);
  beam.style.opacity=String(.08+.71*lightLeft);
  lightCore.style.opacity=String(.06+.69*lightLeft);
  pool.style.opacity=String(.20+.50*lightLeft);
  cardHalo.style.opacity=String(.16+.48*lightLeft);
  if(t>=1.42){
   if(DEMO_MODE==='merged'){
    for(const f of flakes){if(!f.frozen){
     f.frozen=true;f.freezeX=f.x+Math.sin(f.time*f.period+f.phase)*f.dx;
     f.freezeY=f.y;f.freezeAngle=f.angle;f.freezeAt=-10;
    }}
    drawSnow(0,true);
   }
   mode='done';status.textContent='卡牌揭晓完成';
   play.textContent='✦ 再次播放完整动画';
   if(DEMO_MODE==='card')raf=requestAnimationFrame(tick);
   return;
  }
 }else if(mode==='done'){
  if(DEMO_MODE==='card'){snowStep(dt,-1);drawSnow(dt,false);}
  else return;
 }else return;
 raf=requestAnimationFrame(tick);
}
function stageAction(){
 if(play.disabled||mode==='burst')return;
 if(mode==='entrance'){
  cancelAnimationFrame(raf);sunLight(1);snowCanvas.style.opacity='1';
  // Skip only the entrance; do not skip the click-to-reveal burst.
  hover();last=0;raf=requestAnimationFrame(tick);return;
 }
 if(mode==='hover'){explode();return;}
 if(mode==='ready'||mode==='done'){entrance();}
}
stage.onclick=stageAction;
stage.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();stageAction()}};
play.onclick=stageAction;resetBtn.onclick=()=>{idle();entrance();};
window.addEventListener('resize',()=>{
 resize();
 if(mode!=='burst')idle();
});
resize();idle();
})();
</script></body></html>
