name: Briefing V2 checks

on:
  pull_request:
    paths:
      - "app/briefing/**"
      - "app/page.tsx"
      - "app/api/briefing-session/route.ts"
      - "app/api/briefing/route.ts"
      - "tests/briefing-data.test.mjs"
      - "tests/briefing-feed.test.mjs"
      - "tests/briefing-api.test.mjs"
      - ".github/workflows/briefing-v2.yml"
  push:
    branches:
      - "feature/briefing-v2-shell-20261118"

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Briefing data regression
        run: node --experimental-transform-types --test tests/briefing-data.test.mjs tests/briefing-feed.test.mjs tests/briefing-api.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck isolated briefing components
        run: npx tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --jsx react-jsx --lib ES2022,DOM,DOM.Iterable --skipLibCheck --allowSyntheticDefaultImports --strict app/briefing/briefing.tsx app/briefing/briefing-data.ts app/briefing/briefing-feed.ts app/briefing/use-briefing-feed.ts
