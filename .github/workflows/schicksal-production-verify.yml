name: Verify live Schicksal production (read only)
on:
  push:
    branches: [main]
    paths: ["docs/production-postmerge-verify.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: briefing-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SCHICKSAL_PREVIEW_CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SCHICKSAL_PREVIEW_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify exact production revision and original database (no writes)
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          assert.match(account||"",/^[a-f0-9]{32}$/);
          assert.ok(token);
          async function get(path) {
            const response=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+path,{headers:{Authorization:"Bearer "+token},signal:AbortSignal.timeout(30000)});
            const data=await response.json(); assert.ok(response.ok&&data.success,"Cloudflare read failed"); return data.result;
          }
          function wrangler(args) {
            const r=spawnSync(process.execPath,["node_modules/wrangler/bin/wrangler.js",...args],{encoding:"utf8",env:{...process.env,CI:"true"}});
            assert.equal(r.status,0,"Read-only Wrangler command failed");return JSON.parse(r.stdout);
          }
          const list=wrangler(["d1","list","--json"]);
          const prod=list.filter(d=>d.name==="schicksal-db"),preview=list.filter(d=>d.name==="schicksal-ui-preview-db"||d.name==="schicksal-briefing-preview-db");
          assert.equal(prod.length,1);assert.ok(preview.length&&preview.every(d=>d.uuid!==prod[0].uuid));
          const expected=process.env.GITHUB_SHA;
          let verified=false;
          for(let i=0;i<50;i++){
            const settings=await get("/workers/scripts/schicksal/settings");
            const bindings=settings.bindings||[],db=bindings.filter(b=>b.type==="d1");
            assert.equal(db.length,1);assert.equal(db[0].name,"DB");assert.equal(db[0].id??db[0].database_id,prod[0].uuid,"Production binding changed");
            assert.ok(!bindings.some(b=>b.name==="SCHICKSAL_PREVIEW_COMMIT"),"Preview marker on production");
            assert.ok(!bindings.some(b=>b.type==="r2_bucket"&&/preview/i.test(b.bucket_name??b.bucket??"")));
            const marker=bindings.find(b=>b.name==="SCHICKSAL_RELEASE_COMMIT");
            if(marker?.text===expected){verified=true;break;}
            await new Promise(r=>setTimeout(r,10000));
          }
          assert.ok(verified,"Exact production revision not yet confirmed; inspect the native Cloudflare build");
          const migrations=wrangler(["d1","execute","schicksal-db","--remote","--json","--command","SELECT name FROM d1_migrations ORDER BY id"]);
          assert.equal(migrations[0].results.at(-1).name,"0020_parliament_document_versions.sql");
          const counts=wrangler(["d1","execute","schicksal-db","--remote","--json","--command","SELECT (SELECT count(*) FROM committee_vase_history) AS vase_history, (SELECT count(*) FROM member_credentials) AS credentials, (SELECT count(*) FROM parliament_items) AS items, (SELECT count(*) FROM parliament_document_versions) AS versions, (SELECT count(*) FROM parliament_items i LEFT JOIN parliament_document_versions d ON d.item_id=i.id AND d.version=i.version WHERE d.item_id IS NULL OR d.title IS NOT i.title OR d.summary IS NOT i.summary OR d.body IS NOT i.body) AS mismatch"])[0].results[0];
          assert.ok(counts.vase_history>=47&&counts.credentials>=5&&counts.items>=4);assert.equal(counts.mismatch,0);
          for(const route of ["/","/api/parliament","/api/briefing"]){
            const r=await fetch("https://schicksal.m17686100216.workers.dev"+route,{redirect:"manual",signal:AbortSignal.timeout(15000)});
            assert.equal(r.status,401,"Anonymous gate "+route);
            await r.body?.cancel();
          }
          console.log("Exact production SHA verified: "+expected+"; original D1 and schema preserved; no preview database, storage or password copied.");
          NODE
