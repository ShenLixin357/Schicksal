name: Schicksal quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCHICKSAL_MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch immutable migration baseline
        if: env.SCHICKSAL_MIGRATION_BASE != '' && env.SCHICKSAL_MIGRATION_BASE != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "$SCHICKSAL_MIGRATION_BASE"
      - run: npm run check
  build:
    name: Production build
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:app
      # No deployment, remote migrations, or account tokens in this workflow.
