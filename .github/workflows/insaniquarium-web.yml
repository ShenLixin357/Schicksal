name: Original Insaniquarium web engine
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the pinned official Emscripten SDK
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout 1693ce7359fc9694f198694f902a2cc061239b86
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 4.0.20
          ./emsdk activate 4.0.20
      - name: Compile original engine without retail assets
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash ports/insaniquarium/build-web.sh
      - name: Test member saves, offline recovery and native filesystem
        run: npm run test:insaniquarium
      - uses: actions/upload-artifact@v4
        with:
          name: insaniquarium-original-engine-and-source
          path: public/games/insaniquarium
          retention-days: 30

