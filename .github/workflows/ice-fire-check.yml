name: Original engine verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ports/insaniquarium/**"
      - "public/games/insaniquarium/**"
      - "scripts/insaniquarium/**"
      - "tests/insaniquarium-*"
      - ".github/workflows/insaniquarium-web.yml"
      - ".github/workflows/ice-fire-check.yml"
permissions:
  contents: read
concurrency:
  group: native-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-engine:
    uses: ./.github/workflows/insaniquarium-web.yml
