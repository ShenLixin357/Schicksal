name: V3.2 business repair and local browser acceptance
on:
  push:
    branches: [feature/imperial-v32-review]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imperial-v32-review
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review'
    name: Build exact candidate once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:artifact
      - name: Package verified build
        run: |
          mkdir -p "$RUNNER_TEMP/v32-build"
          tar -cf "$RUNNER_TEMP/v32-build/dist.tar" dist
          git rev-parse HEAD > "$RUNNER_TEMP/v32-build/candidate.sha"
          cd "$RUNNER_TEMP/v32-build"
          sha256sum dist.tar > dist.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v32-built-worker
          path: ${{ runner.temp }}/v32-build
          retention-days: 2
          compression-level: 0
  business:
    name: Canonical Gallery and book review SQLite integration
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-transform-types --test integration/imperial-v3/qa/review-store.test.mjs
  browser:
    name: Real local Worker / ${{ matrix.engine }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: v32-built-worker
          path: ${{ runner.temp }}/v32-build
      - name: Restore exact built artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v32-build"
          sha256sum -c dist.tar.sha256
          test "$(cat candidate.sha)" = "$GITHUB_SHA"
          tar -xf dist.tar -C "$GITHUB_WORKSPACE"
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - run: bash integration/imperial-v3/qa/local-browser.sh ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-local-browser-${{ matrix.engine }}
          path: ${{ runner.temp }}/v32-browser/
          if-no-files-found: warn
          retention-days: 7
