name: V3.2 exact-source build and browser acceptance
on:
  push:
    branches: [feature/imperial-v32-review]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imperial-v32-review
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review' && !contains(github.event.head_commit.message, '[preview-deploy]')
    name: Build exact candidate once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:artifact
      - name: Package verified build
        run: |
          mkdir -p "$RUNNER_TEMP/v32-build"
          tar -cf "$RUNNER_TEMP/v32-build/dist.tar" dist
          git rev-parse HEAD > "$RUNNER_TEMP/v32-build/candidate.sha"
          cd "$RUNNER_TEMP/v32-build"
          sha256sum dist.tar > dist.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v32-built-worker
          path: ${{ runner.temp }}/v32-build
          retention-days: 2
          compression-level: 0
  business:
    if: github.ref_name == 'feature/imperial-v32-review' && !contains(github.event.head_commit.message, '[preview-deploy]')
    name: New business / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: review-and-books
            command: node --experimental-transform-types --test integration/imperial-v3/qa/review-store.test.mjs integration/imperial-v3/qa/book-submission.test.mjs
          - suite: storage-and-gallery
            command: node --experimental-transform-types --test integration/imperial-v3/qa/gallery-unified-submit.test.mjs integration/imperial-v3/qa/collection-backup.test.mjs tests/gallery-archive-plan.test.mjs tests/backup-restore.test.mjs
          - suite: achievement-exploration-seed
            command: bash -c 'r=0; for f in integration/imperial-v3/qa/{achievement-sql,limited-exploration,library-seed}.test.py; do python3 "$f" || r=1; done; exit "$r"'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: matrix.suite != 'achievement-exploration-seed'
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        if: matrix.suite == 'achievement-exploration-seed'
        with:
          python-version: '3.12'
      - run: npm ci
        if: matrix.suite != 'achievement-exploration-seed'
      - name: Run independent business suite
        run: ${{ matrix.command }}
  regression:
    if: github.ref_name == 'feature/imperial-v32-review' && !contains(github.event.head_commit.message, '[preview-deploy]')
    name: Existing regression / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: suite-1
            scripts: 'test:emblem-motion test:deployment test:parliament test:ice-fire test:vase test:architecture test:migration-authority test:game-room-return test:asset-audit test:mark-placements test:sidebar-visual-parity'
          - group: suite-2
            scripts: 'test:records test:photos test:minigames test:lounge test:messenger test:identity db:check test:lounge-api test:profile-crystal test:visual-interactions test:briefing'
          - group: suite-3
            scripts: 'test:migration test:privacy test:solitaire test:cello test:shell test:backup-restore test:isolation test:identity-architecture test:performance test:lounge-return test:library'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run every assigned existing regression
        shell: bash
        env:
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          set -uo pipefail
          result=0
          for script in $SCRIPTS; do
            echo "::group::npm run $script"
            npm run "$script" || result=1
            echo "::endgroup::"
          done
          exit "$result"
  browser:
    name: Real local Worker / ${{ matrix.engine }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: v32-built-worker
          path: ${{ runner.temp }}/v32-build
      - name: Restore exact built artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v32-build"
          sha256sum -c dist.tar.sha256
          test "$(cat candidate.sha)" = "$GITHUB_SHA"
          tar -xf dist.tar -C "$GITHUB_WORKSPACE"
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - run: bash integration/imperial-v3/qa/local-browser.sh ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-local-browser-${{ matrix.engine }}
          path: ${{ runner.temp }}/v32-browser/
          if-no-files-found: warn
          retention-days: 7
