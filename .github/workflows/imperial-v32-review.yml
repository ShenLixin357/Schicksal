name: V3.2 targeted browser retry (reuse verified build)
on:
  push:
    branches: [feature/imperial-v32-review]
    paths: [".github/workflows/imperial-v32-review.yml", "integration/imperial-v3/qa/local-browser.py", "integration/imperial-v3/qa/local-browser.sh"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: imperial-v32-review
  cancel-in-progress: false
env:
  V32_BUILT_SHA: dfdc87be3ee4cc49e2270b6d93535d5c36964d13
  V32_BUILD_RUN: '46074320079'
jobs:
  browser:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review'
    name: Real local Worker / ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact build and only QA changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V32_BUILT_SHA" "$GITHUB_SHA"
          git diff --name-only "$V32_BUILT_SHA" "$GITHUB_SHA" | python3 -c 'import sys; allowed={".github/workflows/imperial-v32-review.yml","integration/imperial-v3/qa/local-browser.py","integration/imperial-v3/qa/local-browser.sh"}; assert set(sys.stdin.read().splitlines())<=allowed'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V32_BUILD_RUN/jobs" --jq '.jobs[] | select(.id==140758366583 or .id==140758366853) | .conclusion' | grep -c '^success$' | grep -x 2
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: v32-built-worker
          run-id: ${{ env.V32_BUILD_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v32-build
      - name: Restore exact built artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v32-build"
          sha256sum -c dist.tar.sha256
          test "$(cat candidate.sha)" = "$V32_BUILT_SHA"
          tar -xf dist.tar -C "$GITHUB_WORKSPACE"
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - run: bash integration/imperial-v3/qa/local-browser.sh ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-local-browser-${{ matrix.engine }}
          path: ${{ runner.temp }}/v32-browser/
          if-no-files-found: warn
          retention-days: 7
