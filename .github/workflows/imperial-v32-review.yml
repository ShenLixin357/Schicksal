name: V3.2 isolated candidate acceptance
on:
  push:
    branches: [feature/imperial-v32-review]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imperial-v32-review
  cancel-in-progress: true
jobs:
  foundations:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review'
    name: V3 foundation and isolated SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Existing foundation and proposal checks
        run: |
          set -euo pipefail
          node --test integration/imperial-v3/foundation/*.test.mjs integration/imperial-v3/foundation/events/*.test.mjs
          for f in integration/imperial-v3/foundation/*.test.py; do python3 "$f"; done
  build:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review'
    name: Build exact candidate once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:artifact
      - name: Package verified build
        run: |
          mkdir -p "$RUNNER_TEMP/v32-build"
          tar -cf "$RUNNER_TEMP/v32-build/dist.tar" dist
          git rev-parse HEAD > "$RUNNER_TEMP/v32-build/candidate.sha"
          cd "$RUNNER_TEMP/v32-build"
          sha256sum dist.tar > dist.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v32-built-worker
          path: ${{ runner.temp }}/v32-build
          retention-days: 2
          compression-level: 0
  regression:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review'
    name: Full regression (collect all suite results)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Execute each existing npm test suite once, including after failures
        run: node integration/imperial-v3/qa/run-regression.mjs
  immersive:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review'
    name: R5 immersive library contract (mock lifecycle)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/library-immersive-review.test.mjs
