name: V3.2 focused architecture and R5 repair
on:
  push:
    branches: [feature/imperial-v32-review]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imperial-v32-review
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review'
    name: Build exact candidate once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:artifact
      - name: Package verified build
        run: |
          mkdir -p "$RUNNER_TEMP/v32-build"
          tar -cf "$RUNNER_TEMP/v32-build/dist.tar" dist
          git rev-parse HEAD > "$RUNNER_TEMP/v32-build/candidate.sha"
          cd "$RUNNER_TEMP/v32-build"
          sha256sum dist.tar > dist.tar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v32-built-worker
          path: ${{ runner.temp }}/v32-build
          retention-days: 2
          compression-level: 0
  immersive:
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'feature/imperial-v32-review'
    name: Architecture and R5 targeted regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Recheck failed suites plus neighboring shell and identity contracts
        run: |
          set -euo pipefail
          npm run test:architecture
          npm run test:library
          npm run test:shell
          npm run test:identity-architecture
          npm run test:mark-placements
          npm run test:performance
