name: Production D1 safety preflight (read-only)
on:
  push:
    branches: ["release/production-preflight-20261127"]
    paths: [".github/workflows/schicksal-production-preflight.yml", "scripts/qa/production-d1-rehearsal.mjs"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schicksal-production-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: briefing-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SCHICKSAL_PREVIEW_CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SCHICKSAL_PREVIEW_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Read-only actual production release status
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          node scripts/qa/production-live-status.mjs
