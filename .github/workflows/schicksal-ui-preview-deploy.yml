name: Deploy isolated Schicksal UI preview

# This workflow NEVER runs on a normal push. A connected coding agent can
# trigger it only with an explicit [preview-deploy] commit message, after the
# site owner has set the required GitHub repository secrets.
on:
  push:
    branches:
      - "preview/sidebar-lounge-v4-20261120"
    paths:
      - ".github/workflows/schicksal-ui-preview-deploy.yml"
      - "scripts/cloudflare/prepare-ui-preview.mjs"
      - "app/**"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schicksal-ui-preview-deployment
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: briefing-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.SCHICKSAL_PREVIEW_CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SCHICKSAL_PREVIEW_CF_ACCOUNT_ID }}
      SCHICKSAL_PREVIEW_PASSWORDS: ${{ secrets.SCHICKSAL_PREVIEW_PASSWORDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify preview-only authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing SCHICKSAL_PREVIEW_CF_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing SCHICKSAL_PREVIEW_CF_ACCOUNT_ID"; exit 1; }
          test -n "$SCHICKSAL_PREVIEW_PASSWORDS" || { echo "::error::Missing SCHICKSAL_PREVIEW_PASSWORDS"; exit 1; }
          node --input-type=module - <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";
          if (!/^[a-f0-9]{32}$/i.test(account)) throw new Error("Invalid preview Cloudflare account ID");
          const passwords = JSON.parse(process.env.SCHICKSAL_PREVIEW_PASSWORDS ?? "{}");
          if (typeof passwords.amberina !== "string" || passwords.amberina.length < 12) {
            throw new Error("Preview passwords JSON must provide a distinct 12+ character password for amberina");
          }
          if (Object.keys(passwords).some(k => !["amberina","zxy","truth","kaito","harry"].includes(k))) {
            throw new Error("Preview password list contains unknown member identity");
          }
          NODE
      - name: Install and build the real React website
        run: |
          npm ci
          npm run build
          bash scripts/validate-artifact.sh
      - name: Identify production D1 by name, provision only separate preview D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > "$RUNNER_TEMP/schicksal-d1-inventory.json"
          node --input-type=module - "$RUNNER_TEMP/schicksal-d1-inventory.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { appendFileSync } from "node:fs";
          const databases = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(databases)) throw new Error("Unexpected D1 inventory format");
          const production = databases.filter(d => d.name === "schicksal-db");
          if (production.length !== 1 || !production[0].uuid) {
            throw new Error("Production schicksal-db could not be uniquely identified. Stop; do not deploy.");
          }
          const preview = databases.filter(d => d.name === "schicksal-ui-preview-db");
          if (preview.length > 1) throw new Error("Ambiguous preview DB. Stop.");
          appendFileSync(process.env.GITHUB_ENV, "SCHICKSAL_PROD_D1_ID=" + production[0].uuid + "\n");
          if (preview[0]) appendFileSync(process.env.GITHUB_ENV, "SCHICKSAL_PREVIEW_D1_ID=" + preview[0].uuid + "\n");
          NODE
          # Entries written to GITHUB_ENV are available in the next step.
      - name: Create isolated preview D1 if it does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SCHICKSAL_PREVIEW_D1_ID:-}" ]; then
            npx wrangler d1 create schicksal-ui-preview-db --no-update-config
            npx wrangler d1 list --json > "$RUNNER_TEMP/schicksal-d1-inventory-after.json"
            node --input-type=module - "$RUNNER_TEMP/schicksal-d1-inventory-after.json" <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const dbs = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const preview = dbs.filter(d => d.name === "schicksal-ui-preview-db");
          if (preview.length !== 1 || !preview[0].uuid) throw new Error("Preview database creation could not be verified");
          if (preview[0].uuid === process.env.SCHICKSAL_PROD_D1_ID) throw new Error("Preview D1 matches production. Stop.");
          appendFileSync(process.env.GITHUB_ENV, "SCHICKSAL_PREVIEW_D1_ID=" + preview[0].uuid + "\n");
          NODE
          fi
      - name: Prepare and verify preview-only Worker artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          node --input-type=module - <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync("work/briefing-preview-target.json", JSON.stringify({
            accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
            previewDatabaseId: process.env.SCHICKSAL_PREVIEW_D1_ID,
            productionDatabaseId: process.env.SCHICKSAL_PROD_D1_ID,
            previewDatabaseName: "schicksal-ui-preview-db"
          }, null, 2));
          NODE
          node scripts/cloudflare/prepare-ui-preview.mjs work/briefing-preview-target.json
          npx wrangler deploy --dry-run --config work/ui-preview-dist/server/wrangler.json
      - name: Apply migrations ONLY to the isolated preview D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config work/ui-preview-dist/server/wrangler.json
      - name: Inspect preview-only D1 schema used by briefing (no member data)
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="work/ui-preview-dist/server/wrangler.json"
          npx wrangler d1 execute DB --remote --config "$CONFIG" --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('parliament_items','parliament_votes','parliament_meeting_sessions','parliament_speaker_candidates','parliament_speaker_votes','parliament_audit_events','briefing_archives','member_presence') ORDER BY name;"
          for table in parliament_items parliament_votes parliament_meeting_sessions parliament_speaker_candidates parliament_speaker_votes parliament_audit_events briefing_archives; do
            echo "Columns for $table"
            npx wrangler d1 execute DB --remote --config "$CONFIG" --command "SELECT name, type FROM pragma_table_info('$table') ORDER BY cid;"
          done
      - name: Read-only parliament schema diagnostics on PREVIEW D1 only
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=work/ui-preview-dist/server/wrangler.json
          # Names/column definitions only. No member rows or secrets are printed.
          npx wrangler d1 execute DB --remote --config "$CONFIG" --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'parliament_%' ORDER BY name"
          for table in parliament_items parliament_votes parliament_speaker_candidates parliament_speaker_votes parliament_meeting_sessions parliament_audit_events; do
            echo "Preview schema: $table"
            npx wrangler d1 execute DB --remote --config "$CONFIG" --command "SELECT name FROM pragma_table_info('$table')"
          done
      - name: Publish separate briefing preview Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config work/ui-preview-dist/server/wrangler.json
      - name: Set separate PREVIEW-ONLY login secret
        shell: bash
        run: |
          set -euo pipefail
          printf "%s" "$SCHICKSAL_PREVIEW_PASSWORDS" | npx wrangler secret put SCHICKSAL_MEMBER_PASSWORDS --config work/ui-preview-dist/server/wrangler.json
      - name: Authenticated preview briefing smoke check (no tokens printed)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const root = "https://schicksal-ui-preview.m17686100216.workers.dev";
          const passwords = JSON.parse(process.env.SCHICKSAL_PREVIEW_PASSWORDS || "{}");
          const login = await fetch(root + "/api/member-session", {
            method: "POST", headers: {"Content-Type":"application/json", Origin:root},
            body:JSON.stringify({ citizenId:"amberina", password:passwords.amberina }),
          });
          if (!login.ok) {
            const safeDiagnostic = await login.text();
            // This endpoint returns only public-facing JSON/HTML error messages.
            console.error("Preview login diagnostic:", safeDiagnostic.slice(0, 500));
            throw new Error("Preview member login failed: HTTP " + login.status);
          }
          const cookie = login.headers.get("set-cookie")?.split(";")[0];
          if (!cookie) throw new Error("Preview login did not return a session cookie");
          const briefing = await fetch(root + "/api/briefing", {headers:{Cookie:cookie}, cache:"no-store"});
          const payload = await briefing.json();
          if (!briefing.ok) throw new Error("Preview briefing sync failed: HTTP " + briefing.status + ", " + (payload.error || "no message"));
          if (!Array.isArray(payload.tasks) || !payload.views || !Array.isArray(payload.views.pending)) throw new Error("Briefing returned malformed inbox view");
          console.log("Real authenticated preview briefing OK: HTTP " + briefing.status +
            "; pending=" + payload.views.pending.length + ", archived=" + payload.views.archived.length);
          await fetch(root + "/api/member-session",{method:"DELETE",headers:{Cookie:cookie,Origin:root}});
          NODE
      - name: Authenticated PREVIEW-ONLY briefing smoke test
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const base = "https://schicksal-ui-preview.m17686100216.workers.dev";
          const password = JSON.parse(process.env.SCHICKSAL_PREVIEW_PASSWORDS || "{}").amberina;
          const login = await fetch(base + "/api/member-session", {
            method: "POST", headers: {"Content-Type": "application/json", Origin: base},
            body: JSON.stringify({ citizenId:"amberina", password }),
          });
          if (login.status !== 200) throw new Error("Preview smoke: login returned " + login.status);
          const cookie = login.headers.get("set-cookie")?.split(";")[0];
          if (!cookie) throw new Error("Preview smoke: no signed-in cookie");
          for (const name of ["briefing","presence"]) {
            const response = await fetch(base + "/api/" + name, { headers: { Cookie: cookie } });
            const result = await response.json().catch(() => ({}));
            console.log("Preview authenticated /api/" + name + ": HTTP " + response.status +
              (name === "briefing" && response.ok ? ", tasks=" + (result.tasks?.length ?? "invalid") : ""));
            if (!response.ok) {
              console.error("Diagnostic category:", result.diagnosticCode || result.error || "unknown");
              process.exitCode = 1;
            }
          }
          await fetch(base + "/api/member-session", {method:"DELETE",
            headers:{Cookie:cookie,Origin:base}});
          NODE
      - name: Final summary
        shell: bash
        run: |
          {
            echo "### Schicksal isolated UI preview deployment"
            echo '- Worker name: `schicksal-ui-preview`'
            echo '- Database: `schicksal-ui-preview-db` (separate from production)'
            echo "- Version: $GITHUB_SHA"
            echo "- Source: PR #9 Sidebar/Lounge preview (production remains unchanged)"
            echo "- Read the actual workers.dev URL from the Wrangler deployment output above."
            echo "- Check login, daily news and responsive layout manually before claiming acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
