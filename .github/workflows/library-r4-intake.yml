name: Library R4 isolated integration and acceptance
on:
  push:
    branches: ["intake/library-r4-20261127"]
    paths: ["Schicksal_Library_Integration_Candidate_R4_2026-11-27*.zip", ".github/workflows/library-r4-intake.yml", "scripts/qa/library-r4-*.sh", "scripts/qa/library-r4-extra.py"]
permissions:
  contents: read
concurrency:
  group: schicksal-library-r4-intake
  cancel-in-progress: true
env:
  R4_BASE: e31fe637aeb629bb0a2cf42223041f2c0755871a
  CANDIDATE_SHA: ed8bdf3b02a802a49ba7b96b61485576c2609c15
  SCHICKSAL_LOCAL_SHA: ed8bdf3b02a802a49ba7b96b61485576c2609c15
  R4_ZIP_SHA: 70686764664fd6f328717612437fe824319ab801a2380fe3bfb9045b7be7c646
jobs:
  build:
    name: Verify R4 and build once / regression / permissions
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'intake/library-r4-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: intake
          persist-credentials: false
      - name: Verify and unpack exact approved R4
        run: bash intake/scripts/qa/library-r4-extract.sh
      - uses: actions/checkout@v4
        with:
          path: site
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify already-integrated exact candidate and original asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: site
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$R4_BASE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$R4_BASE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/feature%2Flibrary-integration-20261127" --jq '.commit.sha')" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import pathlib,subprocess,hashlib,json,os
          pkg=pathlib.Path(os.environ["RUNNER_TEMP"])/"library-r4/library-candidate"
          overlay=pkg/"overlay"
          assets=json.loads((pkg/"docs/runtime-assets.json").read_text())
          assert len(assets)==58
          for x in assets:
            p=pathlib.Path("public/library")/x["path"]
            assert p.stat().st_size==x["size"] and hashlib.sha256(p.read_bytes()).hexdigest()==x["sha256"],p
          for p in overlay.rglob("*"):
            if p.is_file(): assert pathlib.Path(p.relative_to(overlay)).read_bytes()==p.read_bytes(),p
          assert hashlib.sha256(pathlib.Path("public/library/library/book/multi/routes.js").read_bytes()).hexdigest()=="8660ae65f1109f766c38cb5bff0d7f476e514ed3d8f3b656288a439a68afb79e"
          print("PASS exact integrated candidate, original overlay bytes and 58 assets")
          PY
          git diff --name-status "$R4_BASE" HEAD > "$RUNNER_TEMP/library-r4-report/changed-files.txt"
          printf 'Base: %s\nCandidate: %s\n' "$R4_BASE" "$CANDIDATE_SHA" | tee "$RUNNER_TEMP/library-r4-report/candidate.txt"
      - name: Install locked dependencies
        working-directory: site
        run: npm ci
      - name: Real complete main-site build
        working-directory: site
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/library-r4-report/build.log"
          npm run validate:artifact 2>&1 | tee "$RUNNER_TEMP/library-r4-report/artifact-validation.log"
      - name: Full regression and actual installed permission route
        working-directory: site
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/library-r4/library-candidate"
          npm test 2>&1 | tee "$RUNNER_TEMP/library-r4-report/full-regression.log"
          AUTH_SOURCE_ROOT="$PWD" node --experimental-transform-types --test "$PKG/tests/permissions-local.mjs" 2>&1 | tee "$RUNNER_TEMP/library-r4-report/permissions.log"
      - name: Package exactly one verified build for all browser runners and preview
        working-directory: site
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/library-r4-built"
          tar -cf "$RUNNER_TEMP/library-r4-built/dist.tar" dist
          cd "$RUNNER_TEMP/library-r4-built"
          sha256sum dist.tar > dist.tar.sha256
          printf '%s' "$CANDIDATE_SHA" > candidate.sha
      - uses: actions/upload-artifact@v4
        with:
          name: library-r4-built-worker-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/library-r4-built/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-r4-build-regression-report
          path: ${{ runner.temp }}/library-r4-report/
          retention-days: 14
          if-no-files-found: warn
  native:
    name: Native Canvas / ${{ matrix.suite }}
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'intake/library-r4-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [lifecycle, dense]
    steps:
      - uses: actions/checkout@v4
        with:
          path: intake
          persist-credentials: false
      - name: Verify and unpack exact approved R4
        run: bash intake/scripts/qa/library-r4-extract.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Render original frozen animation and verify restoration
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/library-r4/library-candidate"
          REPORT="$RUNNER_TEMP/library-r4-report"
          npm install --prefix "$RUNNER_TEMP/library-native" --no-save --package-lock=false skia-canvas
          export SKIA_CANVAS_MODULE="$RUNNER_TEMP/library-native/node_modules/skia-canvas"
          printf '{"type":"module"}\n' > "$PKG/package.json"
          if [ "$SUITE" = lifecycle ]; then
            node "$PKG/tests/render-r4-lifecycle.mjs" 2>&1 | tee "$REPORT/native-lifecycle.log"
          else
            node "$PKG/tests/render-dense.mjs" "$REPORT/occlusion-frames" 2>&1 | tee "$REPORT/native-dense.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-r4-native-${{ matrix.suite }}
          path: ${{ runner.temp }}/library-r4-report/
          retention-days: 14
          if-no-files-found: warn
  fixture:
    name: Browser ${{ matrix.engine }} / ${{ matrix.suite }}
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'intake/library-r4-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        suite: [interaction, debugger]
    steps:
      - uses: actions/checkout@v4
        with:
          path: intake
          persist-credentials: false
      - name: Verify and unpack exact approved R4
        run: bash intake/scripts/qa/library-r4-extract.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only assigned browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Run assigned original interaction or full debugger suite
        env:
          ENGINE: ${{ matrix.engine }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/library-r4/library-candidate"
          REPORT="$RUNNER_TEMP/library-r4-report"
          if [ "$SUITE" = interaction ]; then
            python -u "$PKG/tests/browser-local.py" --engine "$ENGINE" 2>&1 | tee "$REPORT/fixture-$ENGINE.log"
          else
            python -u intake/scripts/qa/library-r4-extra.py "$PKG" "$REPORT" "$ENGINE" 2>&1 | tee "$REPORT/debug-lifecycle-$ENGINE.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-r4-fixture-${{ matrix.engine }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/library-r4-report/
          retention-days: 14
          if-no-files-found: warn
  main_browsers:
    name: Real built Worker / ${{ matrix.engine }}
    needs: build
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'intake/library-r4-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          path: intake
          persist-credentials: false
      - name: Verify and unpack exact approved R4
        run: bash intake/scripts/qa/library-r4-extract.sh
      - uses: actions/checkout@v4
        with:
          path: site
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only assigned browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Install locked dependencies
        working-directory: site
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: library-r4-built-worker-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/library-r4-built
      - name: Restore and verify the single built artifact
        working-directory: site
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/library-r4-built"
          sha256sum -c dist.tar.sha256
          test "$(cat candidate.sha)" = "$CANDIDATE_SHA"
          tar -xf dist.tar -C "$GITHUB_WORKSPACE/site"
      - name: Real built Worker with isolated LOCAL D1 and full browser interaction
        working-directory: site
        env:
          ENGINE: ${{ matrix.engine }}
        run: bash ../intake/scripts/qa/library-r4-local-worker.sh "$ENGINE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-r4-main-${{ matrix.engine }}
          path: ${{ runner.temp }}/library-r4-report/
          retention-days: 14
          if-no-files-found: warn
  isolated_preview:
    name: Publish dedicated library preview only after ALL parallel gates pass
    needs: [build, native, fixture, main_browsers]
    if: github.repository == 'ShenLixin357/Schicksal' && github.ref_name == 'intake/library-r4-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: briefing-preview
    steps:
      - uses: actions/checkout@v4
        with:
          path: intake
          persist-credentials: false
      - name: Verify and unpack exact approved R4
        run: bash intake/scripts/qa/library-r4-extract.sh
      - uses: actions/checkout@v4
        with:
          path: site
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        working-directory: site
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: library-r4-built-worker-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/library-r4-built
      - name: Restore and verify the single built artifact
        working-directory: site
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/library-r4-built"
          sha256sum -c dist.tar.sha256
          test "$(cat candidate.sha)" = "$CANDIDATE_SHA"
          tar -xf dist.tar -C "$GITHUB_WORKSPACE/site"
      - name: Deploy only isolated library Worker with isolated D1, no R2
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SCHICKSAL_PREVIEW_CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SCHICKSAL_PREVIEW_CF_ACCOUNT_ID }}
          SCHICKSAL_PREVIEW_PASSWORDS: ${{ secrets.SCHICKSAL_PREVIEW_PASSWORDS }}
          GH_TOKEN: ${{ github.token }}
        run: bash ../intake/scripts/qa/library-r4-deploy-preview.sh
